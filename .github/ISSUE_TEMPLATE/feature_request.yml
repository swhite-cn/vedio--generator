name: 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前是什么场景让你觉得不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它如何工作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 截图、相关文档或类似项目。
    validations:
      required: false
